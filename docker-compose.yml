services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soundwave}
      POSTGRES_USER: ${POSTGRES_USER:-soundwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundwave-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soundwave} -d ${POSTGRES_DB:-soundwave}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-development-key-change-me}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-local}
      POSTGRES_DB: ${POSTGRES_DB:-soundwave}
      POSTGRES_HOST: database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundwave-local-password}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-soundwave}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health/'));
          assert data.get('status') == 'ok'"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:80"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1/api/health/ |
          grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  media_data:
  postgres_data:
  static_data:
