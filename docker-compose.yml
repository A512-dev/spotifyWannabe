services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soundwave}
      POSTGRES_USER: ${POSTGRES_USER:-soundwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundwave-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soundwave} -d ${POSTGRES_DB:-soundwave}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-development-key-change-me}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-local}
      POSTGRES_DB: ${POSTGRES_DB:-soundwave}
      POSTGRES_HOST: database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundwave-local-password}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-soundwave}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  media_data:
  postgres_data:
  static_data:
